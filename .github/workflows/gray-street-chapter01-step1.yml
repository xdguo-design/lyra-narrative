name: Gray Street Chapter 01 Step 1 Draft

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/gray-street-chapter01-step1.request"

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVEL_DB_PATH: /tmp/gray-street-chapter01-step1.db
      NOVEL_SEED_DEMO: "0"

      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}

      NARRATIVE_WRITER_PROFILE: AGNES
      NARRATIVE_WRITER_FALLBACK_PROFILES: DOTS3,ATRIA

      NARRATIVE_PROVIDER_NAME: AGNES
      NARRATIVE_PROVIDER_PROTOCOL: openai-compatible
      NARRATIVE_PROVIDER_MODEL: agnes-3.0-flash
      NARRATIVE_PROVIDER_BASE_URL: https://api.agnes-ai.cn/v1
      NARRATIVE_PROVIDER_SECRET_NAME: AGNES
      NARRATIVE_PROVIDER_API_KEY: ${{ secrets.AGNES }}

      NOVEL_AI_REASONING_EFFORT: low
      NOVEL_AI_MAX_TOKENS: "7000"
      NOVEL_AI_TIMEOUT_SECONDS: "120"
      NOVEL_AI_HTTP_RETRIES: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install NarrativeOS
        run: pip install -r requirements.txt
      - name: Generate Gray Street chapter 01 step 1 draft
        run: PYTHONPATH=. python scripts/generate_gray_street_chapter01_step1.py
      - name: Upload step 1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-street-chapter01-step1
          path: artifacts/gray-street-chapter01-step1
          if-no-files-found: error
          retention-days: 14
