name: Rewrite v3 Chapter Fast Draft

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/rewrite-v3-chapter-fast.request"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOVEL_DB_PATH: /tmp/rewrite-v3-chapter-fast.db
      NOVEL_SEED_DEMO: "0"

      NARRATIVE_PROFILE_GLM53FLASH: ${{ vars.GLM53FLASH }}
      NARRATIVE_PROFILE_GLM52: ${{ vars.GLM52 }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_SENSENOVA: ${{ vars.SENSENOVA }}
      NARRATIVE_PROFILE_SENSENOVA68: ${{ vars.SENSENOVA68 }}
      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_XINGCHENAGI: ${{ vars.XINGCHENAGI }}
      NARRATIVE_PROFILE_KIMIK3: ${{ vars.KIMIK3 }}
      NARRATIVE_PROFILE_MODELSCOPE: ${{ vars.MODELSCOPE }}

      NARRATIVE_PROFILE_SECRET_GLM53FLASH: ${{ secrets.GLM53FLASH }}
      NARRATIVE_PROFILE_SECRET_GLM: ${{ secrets.GLM }}
      NARRATIVE_PROFILE_SECRET_GLM52: ${{ secrets.GLM52 }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA: ${{ secrets.SENSENOVA }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA68: ${{ secrets.SENSENOVA68 }}
      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_SILICONFLOW: ${{ secrets.SILICONFLOW }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_KIMIK3: ${{ secrets.KIMIK3 }}
      NARRATIVE_PROFILE_SECRET_MODELSCOPE: ${{ secrets.MODELSCOPE }}

      NARRATIVE_WRITER_PROFILE: AGNES
      NARRATIVE_WRITER_FALLBACK_PROFILES: DOTS3,ATRIA
      NARRATIVE_NATURAL_READER_FALLBACK_PROFILES:
      NARRATIVE_REASONING_READER_FALLBACK_PROFILES: GLM52
      NARRATIVE_ROLE_CONTINUITY_PLOT_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_CHARACTER_DIALOGUE_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_LANGUAGE_RHYTHM_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_WRITER_RETRY_PROFILE: DOTS3
      NARRATIVE_REVIEW_MAX_ROUTE_ATTEMPTS: "1"
      NARRATIVE_WRITER_MAX_ROUTE_ATTEMPTS: "2"
      NOVEL_AI_MAX_TOKENS: "5000"
      NOVEL_AI_TEMPERATURE: "0.30"
      NOVEL_AI_TIMEOUT_SECONDS: "90"
      NOVEL_AI_HTTP_RETRIES: "0"
      NOVEL_AI_RETRY_BASE_SECONDS: "2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install NarrativeOS
        run: pip install -r requirements.txt
      - name: Generate fast chapter draft
        run: PYTHONPATH=. python scripts/generate_rewrite_v3_chapter_fast.py
      - name: Upload fast draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-v3-chapter-fast-draft
          path: artifacts/rewrite-v3-chapter-fast-draft
          if-no-files-found: error
          retention-days: 7

      - name: Persist built-in Skill learning
        if: always()
        continue-on-error: true
        run: bash scripts/persist_builtin_skill_learning.sh

      - name: Upload built-in Skill learning recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builtin-skill-learning-recovery
          path: data/builtin-skill-learning
          if-no-files-found: warn
          retention-days: 7
