name: Gray Street 06-10 Resume After Reviewer Retry

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/gray-street-06-10-resume.request"

permissions:
  contents: read
  actions: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NOVEL_DB_PATH: /tmp/gray-street-06-10-resume.db
      NOVEL_SEED_DEMO: "0"
      GRAY_STREET_PREVIOUS_ARTIFACT: artifacts/previous-run
      NARRATIVE_OUTPUT_DIR: artifacts/gray-street-06-10-final

      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_MODELSCOPE: ${{ vars.MODELSCOPE }}
      NARRATIVE_PROFILE_SENSENOVA: ${{ vars.SENSENOVA }}
      NARRATIVE_PROFILE_SENSENOVA68: ${{ vars.SENSENOVA68 }}

      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_MODELSCOPE: ${{ secrets.MODELSCOPE }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA: ${{ secrets.SENSENOVA }}

      NARRATIVE_WRITER_PROFILE: AGNES
      NARRATIVE_WRITER_FALLBACK_PROFILES: DOTS3,ATRIA
      NARRATIVE_NATURAL_READER_PROFILE: AGNES
      NARRATIVE_NATURAL_READER_FALLBACK_PROFILES: DOTS3,ATRIA
      NARRATIVE_REASONING_READER_PROFILE: MODELSCOPE
      NARRATIVE_REASONING_READER_FALLBACK_PROFILES: DOTS3,AGNES,ATRIA
      NARRATIVE_FINAL_REVIEW_PROFILE: AGNES
      NARRATIVE_FINAL_REVIEW_FALLBACK_PROFILES: DOTS3,ATRIA

      NARRATIVE_ROLE_CONTINUITY_PLOT_REVIEWER_PROFILE: MODELSCOPE
      NARRATIVE_ROLE_CHARACTER_DIALOGUE_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_LANGUAGE_RHYTHM_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_WRITER_RETRY_PROFILE: AGNES
      NARRATIVE_ROLE_SCENE_ENRICHER_PROFILE: AGNES
      NARRATIVE_ROLE_PROSE_EDITOR_PROFILE: AGNES
      NARRATIVE_ROLE_REVISION_AGENT_PROFILE: DOTS3

      NARRATIVE_PROVIDER_NAME: AGNES
      NARRATIVE_PROVIDER_PROTOCOL: openai-compatible
      NARRATIVE_PROVIDER_MODEL: agnes-3.0-flash
      NARRATIVE_PROVIDER_BASE_URL: https://api.agnes-ai.cn/v1
      NARRATIVE_PROVIDER_SECRET_NAME: AGNES
      NARRATIVE_PROVIDER_API_KEY: ${{ secrets.AGNES }}

      NOVEL_AI_REASONING_EFFORT: medium
      NOVEL_AI_MAX_TOKENS: "4800"
      NOVEL_AI_TIMEOUT_SECONDS: "120"
      NOVEL_AI_HTTP_RETRIES: "1"
      NOVEL_AI_RETRY_BASE_SECONDS: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NarrativeOS
        run: pip install -r requirements.txt

      - name: Download successful section 6 candidate from prior run
        uses: actions/download-artifact@v4
        with:
          name: gray-street-06-10-platform
          path: artifacts/previous-run
          repository: xdguo-design/lyra-narrative
          run-id: 37426009015
          github-token: ${{ github.token }}

      - name: Run reviewer-only recovery and continue sections 7-10
        run: PYTHONPATH=. python scripts/resume_gray_street_06_10.py

      - name: Upload final platform outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-street-06-10-final
          path: artifacts/gray-street-06-10-final
          if-no-files-found: error
          retention-days: 14
