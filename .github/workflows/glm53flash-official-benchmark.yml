name: GLM53Flash Official Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/glm53flash-official-benchmark.request"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVEL_SEED_DEMO: "0"
      NOVEL_AI_HTTP_RETRIES: "0"

      NARRATIVE_PROFILE_GLM53FLASH: ${{ vars.GLM53FLASH }}
      NARRATIVE_PROFILE_SECRET_GLM53FLASH: ${{ secrets.GLM53FLASH }}
      NARRATIVE_PROFILE_SECRET_GLM: ${{ secrets.GLM }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NarrativeOS
        run: pip install -r requirements.txt

      - name: Benchmark official GLM-5.3-Flash adapter
        run: PYTHONPATH=. python scripts/benchmark_glm53flash_official.py

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm53flash-official-benchmark
          path: artifacts/glm53flash-official-benchmark
          if-no-files-found: warn
          retention-days: 7
