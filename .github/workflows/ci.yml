name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q app tests
      - run: ruff check app tests
      - run: node --check app/static/app.js
      - run: pytest -q

  gray-street-platform:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gray-street-skill-evolution-20261006'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOVEL_DB_PATH: /tmp/gray-street-pr.db
      NOVEL_SEED_DEMO: "0"
      GRAY_STREET_CONTENT_ROOT: content-repo
      NARRATIVE_PROFILE_GLM53FLASH: ${{ vars.GLM53FLASH }}
      NARRATIVE_PROFILE_GLM52: ${{ vars.GLM52 }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_SENSENOVA68: ${{ vars.SENSENOVA68 }}
      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_MODELSCOPE: ${{ vars.MODELSCOPE }}
      NARRATIVE_PROFILE_SECRET_GLM53FLASH: ${{ secrets.GLM53FLASH }}
      NARRATIVE_PROFILE_SECRET_GLM: ${{ secrets.GLM }}
      NARRATIVE_PROFILE_SECRET_GLM52: ${{ secrets.GLM52 }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA68: ${{ secrets.SENSENOVA68 }}
      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_SILICONFLOW: ${{ secrets.SILICONFLOW }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_MODELSCOPE: ${{ secrets.MODELSCOPE }}
      NARRATIVE_WRITER_PROFILE: DOTS3
      NARRATIVE_WRITER_FALLBACK_PROFILES: ATRIA,MODELSCOPE
      NARRATIVE_NATURAL_READER_PROFILE: DOTS3
      NARRATIVE_NATURAL_READER_FALLBACK_PROFILES: ATRIA,MODELSCOPE
      NARRATIVE_REASONING_READER_PROFILE: DOTS3
      NARRATIVE_REASONING_READER_FALLBACK_PROFILES: ATRIA,MODELSCOPE
      NARRATIVE_ROLE_CONTINUITY_PLOT_REVIEWER_PROFILE: DOTS3
      NARRATIVE_ROLE_CHARACTER_DIALOGUE_REVIEWER_PROFILE: DOTS3
      NARRATIVE_ROLE_LANGUAGE_RHYTHM_REVIEWER_PROFILE: ATRIA
      NARRATIVE_REVIEW_MAX_ROUTE_ATTEMPTS: "3"
      NARRATIVE_WRITER_MAX_ROUTE_ATTEMPTS: "3"
      NOVEL_AI_MAX_TOKENS: "7000"
      NOVEL_AI_TEMPERATURE: "0.30"
      NOVEL_AI_TIMEOUT_SECONDS: "240"
      NOVEL_AI_HTTP_RETRIES: "0"
    steps:
      - name: Checkout NarrativeOS
        uses: actions/checkout@v4
      - name: Checkout Gray Street content
        uses: actions/checkout@v4
        with:
          repository: xdguo-design/slow-world-novel
          ref: feature/gray-street-platform-revision-20261006
          path: content-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run NarrativeOS Gray Street revision
        run: PYTHONPATH=. python scripts/run_gray_street_skill_evolution.py
      - name: Upload Gray Street artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-street-skill-evolution
          path: artifacts/gray-street-skill-evolution
          if-no-files-found: warn
          retention-days: 14

