name: Platform Novel Acceptance

on:
  push:
    branches:
      - feature/full-novel-production-pipeline
    paths:
      - ".github/workflows/platform-novel-acceptance.yml"
      - "scripts/run_platform_novel.py"
      - "app/services/production_pipeline.py"
      - "app/services/ai_service.py"
      - "app/ai/providers/**"
  workflow_dispatch:

concurrency:
  group: platform-novel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOVEL_AI_KIND: ollama
      NOVEL_AI_MODEL: qwen3.5:2b
      NOVEL_AI_BASE_URL: http://127.0.0.1:11434
      NOVEL_AI_TIMEOUT_SECONDS: "300"
      NOVEL_AI_BUDGET_PROFILE: ci-local
      NOVEL_AI_OLLAMA_THINK: "false"
      NOVEL_DB_PATH: /tmp/narrative-os-platform-novel.db
      NOVEL_SEED_DEMO: "0"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve >/tmp/ollama.log 2>&1 &
          fi
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull local acceptance model
        run: |
          ollama pull "$NOVEL_AI_MODEL"
          ollama list

      - name: Run NarrativeOS production pipeline
        run: python scripts/run_platform_novel.py

      - name: Show Ollama diagnostics on failure
        if: failure()
        run: tail -200 /tmp/ollama.log || true

      - name: Upload platform production record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-platform-narrativeos-production
          path: artifacts/platform-zero-platform/
          if-no-files-found: warn
          retention-days: 14
