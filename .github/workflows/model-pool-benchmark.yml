name: Model Pool Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/benchmark_all_profiles.py"
      - ".github/requests/model-pool-benchmark.request"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOVEL_SEED_DEMO: "0"
      NOVEL_AI_HTTP_RETRIES: "0"

      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_DEEPSEEKV4PRO: ${{ vars.DEEPSEEKV4PRO }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_GLM52: ${{ vars.GLM52 }}
      NARRATIVE_PROFILE_GLM53FLASH: ${{ vars.GLM53FLASH }}
      NARRATIVE_PROFILE_KIMIK3: ${{ vars.KIMIK3 }}
      NARRATIVE_PROFILE_MODELSCOPE: ${{ vars.MODELSCOPE }}
      NARRATIVE_PROFILE_SENSENOVA: ${{ vars.SENSENOVA }}
      NARRATIVE_PROFILE_SENSENOVA68: ${{ vars.SENSENOVA68 }}
      NARRATIVE_PROFILE_XINGCHENAGI: ${{ vars.XINGCHENAGI }}

      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_DEEPSEEKV4PRO: ${{ secrets.DEEPSEEKV4PRO }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_GLM52: ${{ secrets.GLM52 }}
      NARRATIVE_PROFILE_SECRET_GLM53FLASH: ${{ secrets.GLM53FLASH }}
      NARRATIVE_PROFILE_SECRET_GLM: ${{ secrets.GLM }}
      NARRATIVE_PROFILE_SECRET_KIMIK3: ${{ secrets.KIMIK3 }}
      NARRATIVE_PROFILE_SECRET_MODELSCOPE: ${{ secrets.MODELSCOPE }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA: ${{ secrets.SENSENOVA }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA68: ${{ secrets.SENSENOVA68 }}
      NARRATIVE_PROFILE_SECRET_SILICONFLOW: ${{ secrets.SILICONFLOW }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NarrativeOS
        run: pip install -r requirements.txt

      - name: Benchmark configured model pool
        run: PYTHONPATH=. python scripts/benchmark_all_profiles.py

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-pool-benchmark
          path: artifacts/model-pool-benchmark
          if-no-files-found: warn
          retention-days: 7
