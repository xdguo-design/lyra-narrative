name: Gray Street Chapter Short Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/gray-street-chapter-run.json"

permissions:
  contents: read

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVEL_DB_PATH: /tmp/gray-street-chapter-run.db
      NOVEL_SEED_DEMO: "0"
      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_WRITER_PROFILE: AGNES
      NARRATIVE_WRITER_FALLBACK_PROFILES: DOTS3
      NARRATIVE_ROLE_REVISION_AGENT_PROFILE: AGNES
      NARRATIVE_ROLE_CONTINUITY_REVIEWER_PROFILE: DOTS3
      NARRATIVE_ROLE_CHARACTER_DIALOGUE_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_LANGUAGE_RHYTHM_REVIEWER_PROFILE: DOTS3
      NARRATIVE_ROLE_BLIND_READER_PROFILE: AGNES
      NARRATIVE_ROLE_CADENCE_CHARACTER_READER_PROFILE: DOTS3
      NARRATIVE_ROLE_BLIND_NATURAL_READER_PROFILE: AGNES
      NARRATIVE_ROLE_CHARACTER_VOICE_REVIEWER_PROFILE: AGNES
      NARRATIVE_ROLE_BLIND_DIALOGUE_READER_PROFILE: DOTS3
      NARRATIVE_PROVIDER_NAME: AGNES
      NARRATIVE_PROVIDER_PROTOCOL: openai-compatible
      NARRATIVE_PROVIDER_MODEL: agnes-3.0-flash
      NARRATIVE_PROVIDER_BASE_URL: https://api.agnes-ai.cn/v1
      NARRATIVE_PROVIDER_SECRET_NAME: AGNES
      NARRATIVE_PROVIDER_API_KEY: ${{ secrets.AGNES }}
      NARRATIVE_REVIEW_MAX_ROUTE_ATTEMPTS: "1"
      NOVEL_AI_MAX_TOKENS: "7200"
      NOVEL_AI_TIMEOUT_SECONDS: "100"
      NOVEL_AI_HTTP_RETRIES: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one Gray Street chapter
        run: PYTHONPATH=. python scripts/run_gray_street_chapter.py
      - name: Upload chapter artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-street-chapter-run
          path: artifacts/gray-street-chapter-run
          if-no-files-found: error
          retention-days: 14
