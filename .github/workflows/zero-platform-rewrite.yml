name: Zero Platform NarrativeOS Rewrite

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/zero-platform-rewrite.request"

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOVEL_DB_PATH: /tmp/zero-platform-rewrite.db
      NOVEL_SEED_DEMO: "0"
      NOVEL_AI_KIND: ${{ vars.NOVEL_AI_KIND || 'openai' }}
      NOVEL_AI_MODEL: ${{ vars.NOVEL_AI_MODEL || 'gpt-5.6-sol' }}
      NOVEL_AI_BASE_URL: ${{ vars.NOVEL_AI_BASE_URL || 'https://api.openai.com/v1' }}
      NOVEL_AI_API_KEY_ENV: ${{ vars.NOVEL_AI_API_KEY_ENV || 'OPENAI_API_KEY' }}
      NOVEL_AI_REASONING_EFFORT: ${{ vars.NOVEL_AI_REASONING_EFFORT || 'high' }}
      NOVEL_AI_MAX_TOKENS: ${{ vars.NOVEL_AI_MAX_TOKENS || '8000' }}
      NARRATIVE_OUTPUT_DIR: artifacts/zero-platform-platform-rewrite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NarrativeOS
        run: pip install -r requirements.txt

      - name: Require configured provider key
        shell: bash
        run: |
          KEY_NAME="${NOVEL_AI_API_KEY_ENV}"
          if [ -z "${!KEY_NAME}" ]; then
            echo "::error::Missing API key secret: ${KEY_NAME}"
            echo "::error::Configure provider variables and matching repository secret."
            exit 2
          fi

      - name: Run NarrativeOS full book pipeline
        run: python scripts/run_zero_platform_rewrite.py

      - name: Upload platform outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-platform-platform-rewrite
          path: artifacts/zero-platform-platform-rewrite
          if-no-files-found: ignore
          retention-days: 14
