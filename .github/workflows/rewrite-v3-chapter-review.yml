name: Rewrite v3 Chapter Reader Review

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/rewrite-v3-chapter-review.request"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOVEL_DB_PATH: /tmp/rewrite-v3-reader-review.db
      NOVEL_SEED_DEMO: "0"

      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_ATRIA: ${{ vars.ATRIA }}
      NARRATIVE_PROFILE_DEEPSEEKV4PRO: ${{ vars.DEEPSEEKV4PRO }}
      NARRATIVE_PROFILE_GLM52: ${{ vars.GLM52 }}
      NARRATIVE_PROFILE_KIMIK3: ${{ vars.KIMIK3 }}
      NARRATIVE_PROFILE_MODELSCOPE: ${{ vars.MODELSCOPE }}
      NARRATIVE_PROFILE_SENSENOVA: ${{ vars.SENSENOVA }}
      NARRATIVE_PROFILE_SENSENOVA68: ${{ vars.SENSENOVA68 }}

      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_ATRIA: ${{ secrets.ATRIA }}
      NARRATIVE_PROFILE_SECRET_DEEPSEEKV4PRO: ${{ secrets.DEEPSEEKV4PRO }}
      NARRATIVE_PROFILE_SECRET_GLM52: ${{ secrets.GLM52 }}
      NARRATIVE_PROFILE_SECRET_KIMIK3: ${{ secrets.KIMIK3 }}
      NARRATIVE_PROFILE_SECRET_MODELSCOPE: ${{ secrets.MODELSCOPE }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA: ${{ secrets.SENSENOVA }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA68: ${{ secrets.SENSENOVA68 }}

      NARRATIVE_WRITER_PROFILE: SENSENOVA
      NARRATIVE_WRITER_FALLBACK_PROFILES: AGNES
      NARRATIVE_NATURAL_READER_PROFILE: AGNES
      NARRATIVE_NATURAL_READER_FALLBACK_PROFILES: SENSENOVA,MODELSCOPE
      NARRATIVE_REASONING_READER_PROFILE: MODELSCOPE
      NARRATIVE_REASONING_READER_FALLBACK_PROFILES: AGNES,SENSENOVA
      NARRATIVE_FINAL_REVIEW_PROFILE: SENSENOVA
      NARRATIVE_FINAL_REVIEW_FALLBACK_PROFILES: AGNES,MODELSCOPE
      NARRATIVE_ROLE_CHARACTER_VOICE_REVIEWER_PROFILE: AGNES

      NOVEL_AI_REASONING_EFFORT: high
      NOVEL_AI_MAX_TOKENS: "5000"
      NOVEL_AI_TIMEOUT_SECONDS: "90"
      NOVEL_AI_HTTP_RETRIES: "1"
      NOVEL_AI_RETRY_BASE_SECONDS: "3"
      NARRATIVE_REVIEW_OUTPUT_DIR: artifacts/rewrite-v3-chapter-review

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NarrativeOS
        run: pip install -r requirements.txt

      - name: Review current chapter candidate
        run: PYTHONPATH=. python scripts/review_rewrite_v3_chapter.py

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-v3-chapter-review
          path: artifacts/rewrite-v3-chapter-review
          if-no-files-found: error
          retention-days: 14

      - name: Persist built-in Skill learning
        if: always()
        run: bash scripts/persist_builtin_skill_learning.sh

