name: Gray Street Chapter 01 Step 4 Rewrite

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/requests/gray-street-chapter01-step4.request"

permissions:
  contents: read
  actions: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVEL_DB_PATH: /tmp/gray-street-chapter01-step4.db
      NOVEL_SEED_DEMO: "0"
      GH_TOKEN: ${{ github.token }}

      NARRATIVE_PROFILE_AGNES: ${{ vars.AGNES }}
      NARRATIVE_PROFILE_DOTS3: ${{ vars.DOTS3 }}
      NARRATIVE_PROFILE_SENSENOVA: ${{ vars.SENSENOVA }}
      NARRATIVE_PROFILE_SECRET_AGNES: ${{ secrets.AGNES }}
      NARRATIVE_PROFILE_SECRET_DOTS3: ${{ secrets.DOTS3 }}
      NARRATIVE_PROFILE_SECRET_SENSENOVA: ${{ secrets.SENSENOVA }}

      NARRATIVE_ROLE_REVISION_AGENT_PROFILE: AGNES
      NARRATIVE_WRITER_PROFILE: AGNES
      NARRATIVE_WRITER_FALLBACK_PROFILES: DOTS3,SENSENOVA

      NARRATIVE_PROVIDER_NAME: AGNES
      NARRATIVE_PROVIDER_PROTOCOL: openai-compatible
      NARRATIVE_PROVIDER_MODEL: agnes-3.0-flash
      NARRATIVE_PROVIDER_BASE_URL: https://api.agnes-ai.cn/v1
      NARRATIVE_PROVIDER_SECRET_NAME: AGNES
      NARRATIVE_PROVIDER_API_KEY: ${{ secrets.AGNES }}

      NOVEL_AI_REASONING_EFFORT: low
      NOVEL_AI_MAX_TOKENS: "7500"
      NOVEL_AI_TIMEOUT_SECONDS: "120"
      NOVEL_AI_HTTP_RETRIES: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install NarrativeOS
        run: pip install -r requirements.txt
      - name: Download Step 1 draft
        run: |
          mkdir -p artifacts/step1-input
          gh run download 37280827990 --repo xdguo-design/lyra-narrative --name gray-street-chapter01-step1 --dir artifacts/step1-input
      - name: Download Step 2 specialist review
        run: |
          mkdir -p artifacts/step2-input
          gh run download 37286705867 --repo xdguo-design/lyra-narrative --name gray-street-chapter01-step2 --dir artifacts/step2-input
      - name: Download Step 3 multi-reader review
        run: |
          mkdir -p artifacts/step3-input
          gh run download 37294306970 --repo xdguo-design/lyra-narrative --name gray-street-chapter01-step3 --dir artifacts/step3-input
      - name: Run unified rewrite only
        run: PYTHONPATH=. python scripts/rewrite_gray_street_chapter01_step4.py
      - name: Upload Step 4 rewrite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-street-chapter01-step4
          path: artifacts/gray-street-chapter01-step4
          if-no-files-found: error
          retention-days: 14
