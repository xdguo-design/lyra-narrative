name: Ruff Autofix Cleanup

on:
  push:
    branches:
      - chore/ruff-cleanup-20260928
    paths:
      - ".github/requests/ruff-autofix.request"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ruff-cleanup-20260928
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Ruff fixes
        run: |
          ruff check app tests --fix --unsafe-fixes
          ruff check app tests
          python -m compileall -q app tests
          git diff --check

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "chore: apply ruff cleanup"
          git push origin HEAD:chore/ruff-cleanup-20260928
